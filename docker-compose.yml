services:
  mysql:
    image: mysql:8.4
    container_name: invoiceflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: invoiceflow
      MYSQL_USER: invoiceflow
      MYSQL_PASSWORD: invoiceflow
    ports:
      - "3306:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=caching_sha2_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uinvoiceflow", "-pinvoiceflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: